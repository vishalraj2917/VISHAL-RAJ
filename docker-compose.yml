version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: aqi_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_air_quality
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_air_quality"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aqi_backend
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/ai_air_quality
      SECRET_KEY: supersecretjwtkeyforaqiproject
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ENABLE_DOCS: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aqi_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
